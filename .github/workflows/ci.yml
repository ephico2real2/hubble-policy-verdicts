name: Chart CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/hubble-policy-verdicts
      - name: Render, both delivery paths
        run: |
          helm template t charts/hubble-policy-verdicts -n monitoring | tee /tmp/sidecar.yaml | grep -q "kind: ConfigMap"
          helm template t charts/hubble-policy-verdicts --set sidecar.enabled=false --set grafanaOperator.enabled=true | grep -q "kind: GrafanaDashboard"
      - name: Render with the Loki row, and check the assembled JSON parses with the row and its variable
        run: |
          helm template t charts/hubble-policy-verdicts --set lokiRow.enabled=true --set lokiRow.cf2cnpURL=https://cf2cnp.test | awk '/hubble-policy-verdicts.json: \|-/{f=1;next} f' | sed 's/^    //' > /tmp/with-row.json
          python3 -c "import json; d=json.load(open('/tmp/with-row.json')); assert any(p.get('type')=='row' and 'Loki' in p.get('title','') for p in d['panels']); assert any(v['name']=='DS_LOKI' for v in d['templating']['list']); assert any(v['name']=='cf2cnpURL' and v['query']=='https://cf2cnp.test' for v in d['templating']['list']); assert '${cf2cnpURL}/generate' in json.dumps(d)
          t=next(p for p in d['panels'] if p.get('type')=='table' and 'Flow UUID' in p.get('title','')); org=next(x for x in t['transformations'] if x['id']=='organize'); assert org['options']['excludeByName'].get('Line') is not True, 'Line must stay in the frame for the action body'
          assert any(o['matcher'].get('options')=='Line' and any(pr['id']=='custom.hideFrom.viz' for pr in o['properties']) for o in t['fieldConfig']['overrides']), 'Line hidden from the viz, as dashboard 23862 does'; print('with row:', len(d['panels']), 'panels')"
          helm template t charts/hubble-policy-verdicts | awk '/hubble-policy-verdicts.json: \|-/{f=1;next} f' | sed 's/^    //' > /tmp/without.json
          python3 -c "import json; d=json.load(open('/tmp/without.json')); assert not any(v['name']=='DS_LOKI' for v in d['templating']['list']); print('without:', len(d['panels']), 'panels')"
      - name: Render as a dependency under a camelCase alias (the hubble-observer shape) and validate every name
        run: |
          mkdir -p /tmp/parent/charts && cp -r charts/hubble-policy-verdicts /tmp/parent/charts/
          cat > /tmp/parent/Chart.yaml <<EOF
          apiVersion: v2
          name: parent
          version: 0.0.1
          dependencies:
            - name: hubble-policy-verdicts
              alias: policyVerdictsDashboard
              version: "*"
              condition: policyVerdictsDashboard.enabled
          EOF
          echo "policyVerdictsDashboard: {enabled: true}" > /tmp/parent/values.yaml
          helm template t /tmp/parent -n monitoring > /tmp/aliased.yaml
          grep "^  name:" /tmp/aliased.yaml
          ! grep -E "^  name: .*[A-Z]" /tmp/aliased.yaml
          grep -q "name: hubble-policy-verdicts" /tmp/aliased.yaml
