{{- if .Values.grafanaOperator.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "hubble-policy-verdicts.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hubble-policy-verdicts.labels" . | nindent 4 }}
spec:
  instanceSelector:
    {{- toYaml .Values.grafanaOperator.instanceSelector | nindent 4 }}
  allowCrossNamespaceImport: {{ .Values.grafanaOperator.allowCrossNamespaceImport }}
  folder: {{ .Values.dashboard.folder | quote }}
  json: |-
{{ include "hubble-policy-verdicts.dashboardJSON" . | indent 4 }}
{{- end }}
